  <text x="80" y="132" font-family="Plus Jakarta Sans, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#182420">Relo<tspan fill="#0e7a5c">kit</tspan></text>

  <text x="80" y="268" font-family="Plus Jakarta Sans, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#182420">Ask once. Know</text>
  <text x="80" y="356" font-family="Plus Jakarta Sans, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#182420">everything that matters.</text>

  <text x="80" y="424" font-family="Plus Jakarta Sans, Helvetica, Arial, sans-serif" font-size="30" fill="#5c6b64">Know a place before you get there.</text>

