    <text x="134" y="524" font-size="23" fill="#182420">$2,800 a month</text>
    <text x="134" y="548" font-size="16" fill="#93a09a" font-family="IBM Plex Mono, monospace">the listing · 2d ago</text>

    <rect x="435" y="486" width="330" height="76" rx="12" fill="#f6f7f4" stroke="#e4e8e2"/>
    <text x="461" y="524" font-size="24" fill="#0e7a5c">✓</text>
