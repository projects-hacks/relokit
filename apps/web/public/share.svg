    <text x="489" y="548" font-size="16" fill="#93a09a" font-family="IBM Plex Mono, monospace">route data · 2d ago</text>

    <rect x="790" y="486" width="330" height="76" rx="12" fill="#f6f7f4" stroke="#e4e8e2"/>
